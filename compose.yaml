name: wintrchess

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      - database
    # This server shares its host with other services, so give the app a
    # ceiling it cannot creep past. Steady state is ~200 MB idle and under
    # 1 GB while analysing; the headroom is for concurrent analyses.
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
  database:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - wintrchess-database:/data/db
    attach: false

volumes:
  wintrchess-database: